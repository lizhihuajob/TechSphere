version: '3.8'

services:
  techsphere-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techsphere-website
    ports:
      - "8081:80"
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - techsphere-network

networks:
  techsphere-network:
    driver: bridge
